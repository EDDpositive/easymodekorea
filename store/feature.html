<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>EasyModeKorea feature graphic (1024x500)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #2336e8; color: #fff; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; display: grid; grid-template-columns: 1fr 330px; align-items: center; }
  .txt { padding: 0 0 0 64px; }
  .logo { font: 800 34px "Bricolage Grotesque", "Arial Narrow", sans-serif; letter-spacing: -.01em; }
  .logo b { background: #ffd23f; color: #0e1430; padding: 0 10px; border-radius: 10px; margin-left: 4px; }
  h1 { font: 800 62px/1.04 "Bricolage Grotesque", "Arial Narrow", sans-serif; letter-spacing: -.025em; margin: 26px 0 18px; }
  p { font-size: 25px; line-height: 1.35; margin: 0; color: rgba(255,255,255,.92); max-width: 560px; }
  .card { margin-right: 56px; background: #fff; color: #0e1430; border-radius: 28px; padding: 26px 26px 22px; box-shadow: 0 30px 60px -30px rgba(8,12,60,.8); transform: rotate(3deg); }
  .card small { font: 600 13px "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #444f6b; }
  .card .ko { font: 800 36px/1.3 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; margin: 12px 0 10px; word-break: keep-all; }
  .card .ko i { display: block; font: 700 18px/1.3 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #444f6b; }
  .card .a { background: #ffd23f; border: 2px solid #0e1430; border-radius: 16px; padding: 12px 14px; font: 800 21px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; margin: 0 0 12px; }
  .card .en { font-size: 16px; line-height: 1.35; color: #444f6b; }
  .card .en b { display: block; color: #0e1430; font-size: 19px; }
</style>
</head>
<body>
  <div class="txt">
    <div class="logo">EasyMode<b>Korea</b></div>
    <h1>Korea, on<br>Easy Mode.</h1>
    <p>Refused, lost or hungry? SOS, food card and next steps. Works offline.</p>
  </div>
  <div class="card"><small>Show staff</small><div class="ko" lang="ko"><i>알레르기가 있어요</i>땅콩, 새우</div><div class="a" lang="ko">빼 드릴 수 있어요</div><div class="en">Staff tap. You read: <b>We can leave it out</b></div></div>
</body>
</html>
