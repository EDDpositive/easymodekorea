<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>EasyModeKorea store screenshot frame (1080x1920)</title>
<!-- Used by tools/make_store_assets.py: frame.html?img=../shots/home.png&t=Caption with *yellow words*&s=Small line -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative; background: linear-gradient(170deg, #2a3df0 0%, #2336e8 45%, #1a29bd 100%); color: #fff; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .txt { position: relative; z-index: 1; padding: 118px 90px 0; }
  .logo { font: 800 40px "Bricolage Grotesque", "Arial Narrow", sans-serif; letter-spacing: -.01em; opacity: .95; }
  .logo b { background: #ffd23f; color: #0e1430; padding: 0 12px; border-radius: 12px; margin-left: 4px; }
  h1 { font: 800 84px/1.04 "Bricolage Grotesque", "Arial Narrow", sans-serif; letter-spacing: -.028em; margin: 44px 0 0; max-width: 900px; text-wrap: balance; }
  h1 em { font-style: normal; color: #ffd23f; }
  p { font-size: 38px; line-height: 1.3; margin: 26px 0 0; color: rgba(255,255,255,.9); }
  .phone { position: absolute; left: 50%; bottom: -70px; transform: translateX(-50%); width: 760px; height: 1351px; border: 20px solid #0e1430; border-radius: 86px; overflow: hidden; background: #fff; box-shadow: 0 60px 120px -40px rgba(4,8,40,.85), 0 0 0 3px rgba(255,255,255,.18); }
  .phone img { display: block; width: 100%; height: auto; }
  .sky { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; fill: #fff; opacity: .1; }
</style>
</head>
<body>
<svg class="sky" viewBox="0 0 320 96" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M0 96C38 70 70 62 104 76c26-30 58-44 92-18 26-12 56-16 88-2 14 6 26 14 36 22v18z" opacity=".55"/><path d="M181 61V22h4v39zM176 36h14l-2.5 6h-9zM182.2 8h1.6v14h-1.6z"/><path d="M20 96V70h12v26zm16 0V60h10v36zm14 0V74h14v22zm150 0V66h10v30zm14 0V56h12v40zm16 0V70h9v26zm13 0V62h12v34zm16 0V74h10v22zm14 0V66h12v30z"/></svg>
<div class="txt"><div class="logo">EasyMode<b>Korea</b></div><h1 id="t"></h1><p id="s"></p></div>
<div class="phone"><img id="img" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  const esc = x => x.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("t").innerHTML = esc(q.get("t") || "").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  document.getElementById("s").textContent = q.get("s") || "";
  document.getElementById("img").src = q.get("img") || "";
</script>
</body>
</html>
